name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs the history and tags

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Kevsoft.MigrateMongo.slnx -c Release

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Kevsoft.MigrateMongo.slnx --verify-no-changes --severity warn --no-restore

      - name: Unit tests
        run: dotnet test --project tests/Kevsoft.MigrateMongo.Tests -c Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        # The tool's Native AOT packages are packed by the aot job; its framework-dependent `any` fallback here.
        run: |
          dotnet pack Kevsoft.MigrateMongo.slnx -c Release --no-build -o artifacts/packages
          dotnet pack src/Kevsoft.MigrateMongo.Tool -c Release -r any -p:PublishAot=false -o artifacts/packages

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  driver-compat:
    name: MongoDB.Driver ${{ matrix.driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor the libraries are compiled against, and the newest version we've verified.
        driver: ['3.5.0', '3.12.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build and test against MongoDB.Driver ${{ matrix.driver }}
        run: dotnet test --project tests/Kevsoft.MigrateMongo.Tests -c Release -p:MongoDriverVersion=${{ matrix.driver }}

  aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-latest }
          # Native AOT can't cross-compile from glibc to musl, so these build inside an Alpine container.
          - { rid: linux-musl-x64, os: ubuntu-latest, alpine: true }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, alpine: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !matrix.alpine }}
        with:
          dotnet-version: 10.0.x

      - name: Publish and pack
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          dotnet publish src/Kevsoft.MigrateMongo.Tool -c Release -r ${{ matrix.rid }} -o artifacts/aot/${{ matrix.rid }}
          dotnet pack src/Kevsoft.MigrateMongo.Tool -c Release -r ${{ matrix.rid }} -o artifacts/tool-packages

      - name: Publish and pack (Alpine)
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e CI=true mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -c '
            set -e
            apk add -q clang build-base zlib-dev git
            git config --global --add safe.directory /src
            dotnet publish src/Kevsoft.MigrateMongo.Tool -c Release -r ${{ matrix.rid }} -o artifacts/aot/${{ matrix.rid }}
            dotnet pack src/Kevsoft.MigrateMongo.Tool -c Release -r ${{ matrix.rid }} -o artifacts/tool-packages
            ./artifacts/aot/${{ matrix.rid }}/migrate-mongo version
            chown -R '"$(id -u):$(id -g)"' artifacts'

      - name: Smoke test
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          ./artifacts/aot/${{ matrix.rid }}/migrate-mongo version
          ./artifacts/aot/${{ matrix.rid }}/migrate-mongo --help

      - name: Upload tool package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-package-${{ matrix.rid }}
          path: artifacts/tool-packages/*.nupkg
          if-no-files-found: error

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-${{ matrix.rid }}
          path: |
            artifacts/aot/${{ matrix.rid }}/migrate-mongo
            artifacts/aot/${{ matrix.rid }}/migrate-mongo.exe
          if-no-files-found: error

  release-assets:
    name: Release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [aot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aot-*
          path: aot

      - name: Archive binaries
        # Asset names don't include the version, so releases/latest/download/<asset> always works.
        run: |
          mkdir release
          for dir in aot/aot-*; do
            rid="${dir#aot/aot-}"
            if [[ "$rid" == win-* ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/release/migrate-mongo-${rid}.zip" migrate-mongo.exe)
            else
              chmod +x "$dir/migrate-mongo"
              tar -czf "release/migrate-mongo-${rid}.tar.gz" -C "$dir" migrate-mongo
            fi
          done
          cp scripts/install.sh scripts/install.ps1 release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/*
          if-no-files-found: error

  install-script:
    name: Install script (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [release-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-latest, alpine: true }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, alpine: true }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Serve the release assets
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          (cd release && python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2

      - name: install.sh
        if: ${{ !startsWith(matrix.rid, 'win-') && !matrix.alpine }}
        run: |
          sh release/install.sh --download-url http://127.0.0.1:8080 --install-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/migrate-mongo" version | tee version.txt
          grep -F '(${{ matrix.rid }}; aot)' version.txt

      - name: install.sh (Alpine, wget only)
        if: ${{ matrix.alpine }}
        run: |
          docker run --rm --network host -v "$PWD/release:/release:ro" alpine:3 sh -c '
            set -e
            MIGRATE_MONGO_DOWNLOAD_URL=http://127.0.0.1:8080 sh /release/install.sh
            migrate-mongo version | grep -F "(${{ matrix.rid }}; aot)"'

      - name: install.ps1 (Windows PowerShell)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: powershell
        run: |
          $env:MIGRATE_MONGO_DOWNLOAD_URL = "$PWD\release"
          $env:MIGRATE_MONGO_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          Get-Content -Raw release\install.ps1 | Invoke-Expression
          $version = & "$env:RUNNER_TEMP\bin\migrate-mongo.exe" version
          $version
          if ($version -notlike '*(${{ matrix.rid }}; aot)*') { throw "Unexpected version output: $version" }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains "$env:RUNNER_TEMP\bin") { throw 'The install directory was not added to the user PATH' }

  docker:
    name: Docker images (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [aot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aot-linux-x64
          path: docker/bin/amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aot-linux-arm64
          path: docker/bin/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile only copies the prebuilt binaries, so arm64 builds without QEMU.
      - name: Build tool image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          target: tool
          platforms: linux/amd64,linux/arm64

      - name: Build bundle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          target: bundle
          platforms: linux/amd64,linux/arm64

  integration:
    name: Integration tests (MongoDB Atlas Local)
    # GitHub's Windows and macOS runners can't run Linux containers.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build, aot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages

      # The .NET 10 SDK installs the tool from its Native AOT package for this runner.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-package-linux-x64
          path: artifacts/packages

      - name: Use the CI packages
        run: |
          version=$(ls artifacts/packages/Kevsoft.MigrateMongo.Runner.*.nupkg | sed -E 's/.*Kevsoft\.MigrateMongo\.Runner\.(.*)\.nupkg/\1/')
          echo "Testing packages version $version"
          echo "MIGRATE_MONGO_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MIGRATE_MONGO_PACKAGE_FEED=$GITHUB_WORKSPACE/artifacts/packages" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aot-linux-x64
          path: docker/bin/amd64

      - name: Build the Docker images under test
        run: |
          docker build --target tool -t migrate-mongo:ci docker
          docker build --target bundle -t migrate-mongo:ci-bundle docker
          echo "MIGRATE_MONGO_TEST_TOOL_IMAGE=migrate-mongo:ci" >> "$GITHUB_ENV"
          echo "MIGRATE_MONGO_TEST_BUNDLE_IMAGE=migrate-mongo:ci-bundle" >> "$GITHUB_ENV"

      - name: Integration tests
        run: dotnet test --project tests/Kevsoft.MigrateMongo.IntegrationTests -c Release

  smoke:
    name: Tool install (${{ matrix.name }}, .NET ${{ matrix.sdk }} SDK)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [build, aot]
    strategy:
      fail-fast: false
      matrix:
        include:
          # .NET 10+ SDKs install the Native AOT package for the platform.
          - { name: linux-x64, os: ubuntu-latest, sdk: 10, expect: 'linux-x64; aot' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, sdk: 10, expect: 'linux-arm64; aot' }
          - { name: linux-musl-x64, os: ubuntu-latest, sdk: 10, alpine: true, expect: 'linux-musl-x64; aot' }
          - { name: linux-musl-arm64, os: ubuntu-24.04-arm, sdk: 10, alpine: true, expect: 'linux-musl-arm64; aot' }
          - { name: win-x64, os: windows-latest, sdk: 10, expect: 'win-x64; aot' }
          - { name: win-arm64, os: windows-11-arm, sdk: 10, expect: 'win-arm64; aot' }
          - { name: osx-x64, os: macos-15-intel, sdk: 10, expect: 'osx-x64; aot' }
          - { name: osx-arm64, os: macos-latest, sdk: 10, expect: 'osx-arm64; aot' }
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ !matrix.alpine }}
        with:
          dotnet-version: ${{ matrix.sdk }}.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-package-*
          path: packages
          merge-multiple: true

      - name: Write the install script
        shell: bash
        run: |
          # Runners have newer SDKs preinstalled, so pin the one under test.
          echo '{"sdk":{"version":"${{ matrix.sdk }}.0.100","rollForward":"latestFeature"}}' > global.json
          cat > install.sh <<'EOF'
          set -e
          dotnet --version
          version=$(ls packages/Kevsoft.MigrateMongo.Tool.[0-9]*.nupkg | sed -E 's/.*Kevsoft\.MigrateMongo\.Tool\.(.*)\.nupkg/\1/')
          dotnet tool install Kevsoft.MigrateMongo.Tool --version "$version" --add-source ./packages --tool-path ./tool
          # On Windows the SDK installs RID-specific tools with a .cmd shim, which bash can't run directly.
          if [ -f tool/migrate-mongo.cmd ]; then
            shim=$(cygpath -w "$PWD/tool/migrate-mongo.cmd")
            mm() { cmd //c "$shim" "$@"; }
          else
            shim="$PWD/tool/migrate-mongo"
            mm() { "$shim" "$@"; }
          fi
          mm version | tee version.txt
          grep -qF "$1" version.txt
          mkdir demo && cd demo
          mm init
          mm create AddUsersCollection
          ls Migrations/Migrations
          EOF

      - name: Install and run the tool
        if: ${{ !matrix.alpine }}
        shell: bash
        run: bash install.sh '${{ matrix.expect }}'

      - name: Install and run the tool (Alpine)
        if: ${{ matrix.alpine }}
        run: docker run --rm -v "$PWD:/w" -w /w mcr.microsoft.com/dotnet/sdk:10.0-alpine sh install.sh '${{ matrix.expect }}'

  publish-preview:
    name: Publish preview packages (GitHub Packages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [integration, smoke, aot, driver-compat]
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-package-*
          path: packages
          merge-multiple: true

      - name: Push
        # The tool's RID-specific packages must exist before the package that points at them, so it goes last.
        run: |
          mkdir pointer && mv packages/Kevsoft.MigrateMongo.Tool.[0-9]*.*nupkg pointer/
          for dir in packages pointer; do
            dotnet nuget push "$dir/*.nupkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GITHUB_TOKEN }}" \
              --skip-duplicate
          done

  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, driver-compat, aot, integration, smoke, release-assets, install-script, docker]
    steps:
      - name: Check all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
