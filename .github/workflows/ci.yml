name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build & unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the history and tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Kevsoft.MigrateMongo.slnx -c Release

      - name: Unit tests
        run: dotnet test --project tests/Kevsoft.MigrateMongo.Tests -c Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Kevsoft.MigrateMongo.slnx -c Release --no-build -o artifacts/packages

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  driver-compat:
    name: MongoDB.Driver ${{ matrix.driver }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the libraries are compiled against, and the newest version we've verified.
        driver: ['3.5.0', '3.12.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build and test against MongoDB.Driver ${{ matrix.driver }}
        run: dotnet test --project tests/Kevsoft.MigrateMongo.Tests -c Release -p:MongoDriverVersion=${{ matrix.driver }}

  aot:
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Kevsoft.MigrateMongo.Tool -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true -o artifacts/aot/${{ matrix.rid }}

      - name: Smoke test
        shell: bash
        run: |
          ./artifacts/aot/${{ matrix.rid }}/migrate-mongo version
          ./artifacts/aot/${{ matrix.rid }}/migrate-mongo --help

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.rid }}
          path: |
            artifacts/aot/${{ matrix.rid }}/migrate-mongo
            artifacts/aot/${{ matrix.rid }}/migrate-mongo.exe
          if-no-files-found: error

  integration:
    name: Integration tests (MongoDB Atlas Local)
    # GitHub's Windows and macOS runners can't run Linux containers.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Use the CI packages
        run: |
          version=$(ls artifacts/packages/Kevsoft.MigrateMongo.Runner.*.nupkg | sed -E 's/.*Kevsoft\.MigrateMongo\.Runner\.(.*)\.nupkg/\1/')
          echo "Testing packages version $version"
          echo "MIGRATE_MONGO_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MIGRATE_MONGO_PACKAGE_FEED=$GITHUB_WORKSPACE/artifacts/packages" >> "$GITHUB_ENV"

      - name: Integration tests
        run: dotnet test --project tests/Kevsoft.MigrateMongo.IntegrationTests -c Release

  smoke:
    name: Tool install (${{ matrix.os }}, .NET ${{ matrix.dotnet }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The tool targets net8.0 with RollForward=LatestMajor, so it must run on whatever runtime is installed.
        dotnet: ['8.0.x', '10.0.x']
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Install and run the tool
        shell: bash
        run: |
          version=$(ls packages/Kevsoft.MigrateMongo.Tool.*.nupkg | sed -E 's/.*Kevsoft\.MigrateMongo\.Tool\.(.*)\.nupkg/\1/')
          dotnet tool install Kevsoft.MigrateMongo.Tool --version "$version" --add-source ./packages --tool-path ./tool
          ./tool/migrate-mongo version
          mkdir demo && cd demo
          ../tool/migrate-mongo init
          ../tool/migrate-mongo create AddUsersCollection
          ls Migrations/Migrations

  publish-preview:
    name: Publish preview packages (GitHub Packages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [integration, smoke, aot, driver-compat]
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

  ci-success:
    name: CI success
    if: always()
    runs-on: ubuntu-latest
    needs: [build, driver-compat, aot, integration, smoke]
    steps:
      - name: Check all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
