name: Release

# Push a tag like v1.2.0 (or v1.2.0-beta.1 for a prerelease). MinVer turns the tag into the package version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # only used by CI's preview publishing on main, which is skipped for tags

  nuget:
    name: Publish to NuGet
    needs: ci
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # NuGet Trusted Publishing (OIDC); no long-lived API key
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/download-artifact@v8
        with:
          pattern: tool-package-*
          path: packages
          merge-multiple: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Attest build provenance
        # Attestations aren't available for private user-owned repositories.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/*.nupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        # The tool's RID-specific packages must exist before the package that points at them, so it goes last.
        run: |
          mkdir pointer && mv packages/Kevsoft.MigrateMongo.Tool.[0-9]*.*nupkg pointer/
          for dir in packages pointer; do
            dotnet nuget push "$dir/*.nupkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  github-release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Archives, SHA256SUMS, install.sh and install.ps1, built and tested by CI.
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/migrate-mongo-*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease

  docker:
    name: Publish Docker images (ghcr.io)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/migrate-mongo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: aot-linux-x64
          path: docker/bin/amd64

      - uses: actions/download-artifact@v8
        with:
          name: aot-linux-arm64
          path: docker/bin/arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 1.2.3 → 1.2.3, 1.2, 1 and latest; prereleases (1.2.3-beta.1) only get their own tag.
      - name: Tool image tags
        id: tool
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Bundle image tags
        id: bundle
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-bundle,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Push tool image
        id: push-tool
        uses: docker/build-push-action@v7
        with:
          context: docker
          target: tool
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tool.outputs.tags }}
          labels: ${{ steps.tool.outputs.labels }}

      - name: Push bundle image
        id: push-bundle
        uses: docker/build-push-action@v7
        with:
          context: docker
          target: bundle
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.bundle.outputs.tags }}
          labels: ${{ steps.bundle.outputs.labels }}

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-tool.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (bundle)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-bundle.outputs.digest }}
          push-to-registry: true