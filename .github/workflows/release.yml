name: Release

# Push a tag like v1.2.0 (or v1.2.0-beta.1 for a prerelease). MinVer turns the tag into the package version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write # only used by CI's preview publishing on main, which is skipped for tags

  nuget:
    name: Publish to NuGet
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nuget
    permissions:
      id-token: write # NuGet Trusted Publishing (OIDC); no long-lived API key
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-package-*
          path: packages
          merge-multiple: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Attest build provenance
        # Attestations aren't available for private user-owned repositories.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/*.nupkg

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        # The tool's RID-specific packages must exist before the package that points at them, so it goes last.
        run: |
          mkdir pointer && mv packages/Kevsoft.MigrateMongo.Tool.[0-9]*.*nupkg pointer/
          for dir in packages pointer; do
            dotnet nuget push "$dir/*.nupkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  # The GitHub release and the images wait for the NuGet job (and its environment's approval), so a rejected or failed
  # NuGet publish doesn't leave a public release or images for a version that isn't on NuGet.
  github-release:
    name: GitHub release
    needs: [ci, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Archives, SHA256SUMS, install.sh and install.ps1, built and tested by CI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/migrate-mongo-*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease

  docker:
    name: Publish Docker images (ghcr.io)
    needs: [ci, nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/migrate-mongo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aot-linux-x64
          path: docker/bin/amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aot-linux-arm64
          path: docker/bin/arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 1.2.3 → 1.2.3, 1.2, 1 and latest; prereleases (1.2.3-beta.1) only get their own tag.
      - name: Tool image tags
        id: tool
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Bundle image tags
        id: bundle
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-bundle,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Push tool image
        id: push-tool
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          target: tool
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tool.outputs.tags }}
          labels: ${{ steps.tool.outputs.labels }}

      - name: Push bundle image
        id: push-bundle
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          target: bundle
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.bundle.outputs.tags }}
          labels: ${{ steps.bundle.outputs.labels }}

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-tool.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (bundle)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push-bundle.outputs.digest }}
          push-to-registry: true