version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-dependencies:
        patterns: ['xunit*', 'Shouldly', 'Testcontainers*', 'Microsoft.NET.Test.Sdk']
    ignore:
      # MongoDB.Driver in Directory.Packages.props is the deliberate minimum supported version.
      - dependency-name: MongoDB.Driver
      # Kept at the same version as the driver floor (it requires MongoDB.Driver >= its own version).
      - dependency-name: MongoDB.Driver.Authentication.AWS
      # Shipped libraries target net10.0; a newer major would force it onto every user's project.
      - dependency-name: Microsoft.Extensions.*
        update-types: ['version-update:semver-major']
      # Roslyn version = minimum compiler/SDK that can load the source generator.
      - dependency-name: Microsoft.CodeAnalysis.*
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
